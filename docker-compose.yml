version: '3.8'

services:

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://todouser:1234@db:5432/tododb
      - SECRET_KEY=mysecretkey
      - DEBUG=False
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=tododb
      - POSTGRES_USER=todouser
      - POSTGRES_PASSWORD=1234
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

