<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Todo App</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>📝 DevOps Todo App</h1>

        <!-- Stats -->
        <div class="stats" id="stats">Loading...</div>

        <!-- Input -->
        <div class="input-row">
            <input
                type="text"
                id="todoInput"
                placeholder="Add a new task..."
                onkeypress="handleKey(event)"
            />
            <button onclick="createTodo()">Add</button>
        </div>

        <!-- Todo List -->
        <div id="todoList"></div>
    </div>

    <script>
        // Load todos when page opens
        window.onload = loadTodos;

        async function loadTodos() {
            const res = await fetch('/todos');
            const todos = await res.json();
            renderTodos(todos);
        }

        function renderTodos(todos) {
            const list = document.getElementById('todoList');
            const stats = document.getElementById('stats');

            // Update stats
            const done = todos.filter(t => t.done).length;
            stats.textContent = `${done} of ${todos.length} tasks completed`;

            // Render list
            if (todos.length === 0) {
                list.innerHTML = '<div class="empty">No todos yet — add one above! 🚀</div>';
                return;
            }

            list.innerHTML = todos.map(todo => `
                <div class="todo-item ${todo.done ? 'done' : ''}" id="todo-${todo.id}">
                    <span>${todo.title}</span>
                    <div class="actions">
                        <button class="btn-done" onclick="toggleTodo(${todo.id})">
                            ${todo.done ? 'Undo' : '✓ Done'}
                        </button>
                        <button class="btn-delete" onclick="deleteTodo(${todo.id})">
                            🗑 Delete
                        </button>
                    </div>
                </div>
            `).join('');
        }

        async function createTodo() {
            const input = document.getElementById('todoInput');
            const title = input.value.trim();
            if (!title) return;

            await fetch('/todos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title })
            });

            input.value = '';
            loadTodos();
        }

        async function toggleTodo(id) {
            await fetch(`/todos/${id}`, { method: 'PUT' });
            loadTodos();
        }

        async function deleteTodo(id) {
            await fetch(`/todos/${id}`, { method: 'DELETE' });
            loadTodos();
        }

        // Allow pressing Enter to add todo
        function handleKey(event) {
            if (event.key === 'Enter') createTodo();
        }
    </script>
</body>
</html>
